name: Pipeline Smoke Test

# Runs the full ETL -> analytics -> ML pipeline against a throwaway SQLite
# database on every push/PR, so the repo always shows a live "tests passing"
# badge without needing a real Postgres instance or a Groq API key in CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy SQLAlchemy python-dotenv requests scikit-learn xgboost lightgbm Faker

      - name: Run end-to-end smoke test (ETL -> KPIs -> clustering -> forecast -> need score)
        run: python tests/test_pipeline.py

      - name: Lint check (syntax-only, non-blocking)
        run: python -m py_compile $(git ls-files '*.py')
        continue-on-error: true
